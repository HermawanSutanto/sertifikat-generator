[package]
name = "pdf_cert_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1.0", features = ["derive"] }
lopdf = "0.34"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"     # Optimasi ukuran file biner WASM
lto = true          # Link Time Optimization
codegen-units = 1
panic = "abort"